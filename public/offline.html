<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Gehna Jewellery</title>
  <style>
    body {
      background-color: #fff8f0;
      color: #5c1a1b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .container {
      max-width: 400px;
      padding: 24px;
      border: 1px border #d4af37;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(92, 26, 27, 0.05);
      margin: 16px;
    }
    .logo {
      margin-bottom: 24px;
      width: 120px;
      height: auto;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px 0;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    p {
      font-size: 15px;
      color: #7a6e6e;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      background-color: #5c1a1b;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #7a2426;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .connection-status {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      background-color: #fce8e6;
      color: #c53929;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/images/gehna-logo.svg" alt="Gehna Logo" class="logo">
    <div class="connection-status">No Connection</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again. Once you are back online, click the button below to reload.</p>
    <button class="btn" onclick="window.location.reload();">Retry Connection</button>
  </div>
  
  <script>
    // Automatically try to reload if connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
